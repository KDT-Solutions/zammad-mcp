services:
  zammad-mcp:
    # Fertiges Image aus der GitHub Container Registry statt lokalem Build -
    # das Image wird per GitHub Actions bei jedem Push auf main automatisch
    # gebaut und veroeffentlicht (.github/workflows/docker-publish.yml).
    # Dadurch funktioniert "Pull and redeploy" in Portainer zuverlaessig:
    # Portainer kann Images pullen, aber ein Dockerfile im Repo nicht
    # zuverlaessig automatisch neu bauen (bekannte Einschraenkung).
    image: ghcr.io/kdt-solutions/zammad-mcp:latest
    # Bei jedem Deploy/Redeploy das Image aus der Registry neu ziehen, statt
    # eine lokal schon vorhandene (evtl. veraltete) :latest-Kopie zu verwenden.
    pull_policy: always
    container_name: zammad-mcp-cloud
    restart: unless-stopped
    environment:
      - ZAMMAD_URL=${ZAMMAD_URL}
      - ZAMMAD_TOKEN=${ZAMMAD_TOKEN}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
      # OCR (optional, Standardwerte siehe README)
      - OCR_TIMEOUT_SECONDS=${OCR_TIMEOUT_SECONDS:-50}
      - OCR_MAX_PAGES=${OCR_MAX_PAGES:-60}
      - OCR_DPI=${OCR_DPI:-300}
      - OCR_LANGS=${OCR_LANGS:-deu+fra+eng+ita}
      # Disk-Cache fuer OCR-Ergebnisse, leer = aus. Fuer einen Cache ueber Redeploys
      # hinweg zusaetzlich das Volume unten aktivieren und OCR_CACHE_DIR=/cache/ocr setzen.
      - OCR_CACHE_DIR=${OCR_CACHE_DIR:-}
      - OCR_CACHE_TTL_HOURS=${OCR_CACHE_TTL_HOURS:-24}
    # volumes:
    #   - zammad-mcp-ocr-cache:/cache/ocr
    ports:
      # Auf allen Interfaces gebunden (Standard wie bei allen MCP-Stacks), damit
      # NPM den Dienst ueber <Host-IP>:8420 erreicht. Die Zugriffskontrolle ist das
      # Bearer-Token, TLS macht der Reverse-Proxy. Ueber MCP_BIND_ADDR einschraenkbar.
      - "${MCP_BIND_ADDR:-0.0.0.0}:${MCP_HOST_PORT:-8420}:8000"

