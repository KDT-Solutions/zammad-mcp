[project]
name = "zammad-mcp"
# Nur Major.Minor wird von Hand gepflegt, der Patch-Teil wird automatisch
# aus der Git-Historie gezaehlt (siehe _read_version im Paket).
version = "1.28.0"
description = "Zammad MCP Server für Claude (HTTP/Docker, Cloud)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.27.0",
    "pdfminer.six>=20231228",
    "pypdf>=4.0.0",
    "fonttools>=4.40.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "regex>=2023.8.8",
    "pypdfium2>=4.20.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zammad_mcp"]
