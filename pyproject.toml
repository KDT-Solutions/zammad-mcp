[project]
name = "zammad-mcp"
version = "1.13.0"
description = "Zammad MCP Server für Claude (stdio lokal + HTTP/Docker cloud)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
zammad-mcp = "zammad_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zammad_mcp"]
